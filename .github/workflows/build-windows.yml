# WxAuto 桌面 App Windows 打包（NSIS 安装包）
# 产物: WxAutoDesktop_<version>_x64-setup.exe
# 触发: push 到 main / 打 v* tag（自动发 Release）/ 手动触发
name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Rust（MSVC）
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 打包（NSIS x64 安装包）
        run: pnpm tauri build

      - name: 收集产物
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # 递归收集 bundle 下全部 exe（NSIS 安装包 + 语言包，路径防御式搜索）
          if (Test-Path $bundle) {
            Get-ChildItem -Path $bundle -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
              Copy-Item -Destination artifacts/
          }
          if (-not (Get-ChildItem artifacts/*.exe -ErrorAction SilentlyContinue)) {
            Write-Host "== 诊断：bundle 目录树 =="
            if (Test-Path $bundle) {
              Get-ChildItem -Path $bundle -Recurse | ForEach-Object { $_.FullName }
            } else {
              Write-Host "bundle 目录不存在: $bundle"
              Write-Host "== 诊断：target/release 一级内容 =="
              Get-ChildItem "src-tauri/target/release" -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
              Write-Host "== 诊断：target 一级内容 =="
              Get-ChildItem "src-tauri/target" -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
            }
            throw "未找到 NSIS 安装包产物"
          }
          Get-ChildItem artifacts/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/*.exe
          if-no-files-found: error

      - name: 发布 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
          generate_release_notes: true
