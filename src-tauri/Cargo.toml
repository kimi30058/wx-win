# WxAuto 桌面 App Rust 编排核心（暂不引入 tauri 依赖——Task 9 再装配 GUI，核心库先行可测）
[package]
name = "wxauto-desktop"
version = "0.1.0"
edition = "2021"
description = "WxAuto 微信自动化桌面 App 核心"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
tokio-tungstenite = "0.24"
futures-util = "0.3"
rand = "0.8"
dirs = "6"
# webhook 告警（2026-09-10 P1）：tauri 传递已引入 reqwest 0.13 但未激活
# TLS 后端——显式 rustls（纯 Rust TLS，Windows 打包无 OpenSSL 依赖）。
# 注意：reqwest 0.13 起 feature 由 0.12 的 rustls-tls 改名 rustls
# （0.13 的 default-tls 即 = rustls，纯 Rust TLS 已是默认路径）
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# token 持久化：Windows Credential Manager / macOS Keychain / Linux Secret Service
# keyring 3.x 无 default features：不指定平台后端 = 全平台落到 mock store
# （EntryOnly：值挂在 Entry 实例内存，跨 Entry::new 不可见）——生产表现为
# 「设置 token 成功但读取恒 NoEntry → 连接恒 4001」。产品只发 Windows，
# 只启用 windows-native（Windows Credential Manager）；非 Windows 平台
# （本地 Linux dev/CI runner）回落 mock，相关测试用 cfg 守卫跳过。
keyring = { version = "3", features = ["windows-native"] }
tauri = { version = "2.11.5", features = ["test"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = "2"
